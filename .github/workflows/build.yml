# Runs in the public mirror of the icon sets. The framework arrives as a package here, so this also proves
# that the version these sets are built against is really on the feed.
name: Build

on:
  # Branches only: a sync pushes the tag too, and an unfiltered push would build the same commit twice.
  push:
    branches:
      - '**'
  pull_request:
  # nuget.org indexes a new version a few minutes after it is pushed, and the sync lands sooner than that.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The stylesheet is generated from the icon set as part of `dotnet build`.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes
